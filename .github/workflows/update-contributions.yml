name: Refresh open-source contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh contribution wall
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: yaobii-lab
        run: python scripts/update_contributions.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md assets/open-source-contributions.svg; then
            echo "No contribution changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/open-source-contributions.svg
          git commit -m "chore: refresh open-source contributions"
          git push
